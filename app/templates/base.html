<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Research Portal Setup Kit{% endblock %}</title>
<link rel="stylesheet" href="/static/css/app.css">
{% block head %}{% endblock %}
</head>
<body>
<div class="topbar">
  <a class="brand" href="/">Research Portal Setup Kit</a>
  <div class="right">
    <a class="exit" href="/">Save &amp; exit</a>
  </div>
</div>
<div class="page">
{% if flash %}<div class="flash {{ 'err' if flash_error else '' }}">{{ flash }}</div>{% endif %}
{% block body %}{% endblock %}
</div>
</body>
</html>
